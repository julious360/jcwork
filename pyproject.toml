[project]
name = "adagent"
version = "0.1.0"
description = "Autonomous, self-optimizing Facebook Ads marketing agent"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "clickhouse-connect>=0.7",
    "psycopg[binary]>=3.1",
    "typer>=0.12",
    "tenacity>=8.3",
    "structlog>=24.1",
    "pyyaml>=6.0",
    "anthropic>=0.34",
    "google-genai>=0.3",
    "pillow>=10.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "sqlglot>=25.0",
]

[project.scripts]
adagent = "agent.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*"]

[tool.setuptools.package-data]
agent = ["config/*.yaml", "research/fixtures/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
