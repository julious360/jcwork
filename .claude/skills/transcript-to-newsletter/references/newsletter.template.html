<!-- Newsletter shell. Table-based, inline CSS, 600px, no <style> block, no web fonts.
     Placeholders: {{ subject }} {{ preheader }} {{ issue_no }} {{ date }}
     {{ cold_open }} {{ section_N_title }} {{ section_N_body }}
     {{ quote }} {{ quote_attribution }} {{ takeaway_N }} {{ signoff }}
     {{ unsubscribe_url }} {{ web_url }}
     Palette: ink #101828 · primary #2E5BFF · accent #FFB020 · paper #F7F8FA -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ subject }}</title>
</head>
<body style="margin:0;padding:0;background:#F7F8FA;">
<div style="display:none;font-size:1px;color:#F7F8FA;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;">{{ preheader }}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#F7F8FA;">
<tr><td align="center" style="padding:32px 12px;">
  <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px;max-width:100%;background:#FFFFFF;border-radius:12px;overflow:hidden;">

    <tr><td style="padding:28px 32px 8px 32px;font-family:'Inter Tight',Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
      <div style="font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#667085;">Issue {{ issue_no }} · {{ date }}</div>
      <h1 style="margin:8px 0 0 0;font-size:26px;line-height:1.25;color:#101828;font-weight:700;">{{ subject }}</h1>
    </td></tr>

    <tr><td style="padding:16px 32px 0 32px;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.65;color:#344054;">
      <p style="margin:0 0 20px 0;">{{ cold_open }}</p>
    </td></tr>

    <!-- Repeat this block for sections 1..3 -->
    <tr><td style="padding:0 32px;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
      <h2 style="margin:24px 0 8px 0;font-size:19px;line-height:1.3;color:#101828;font-weight:700;">{{ section_1_title }}</h2>
      <p style="margin:0;font-size:16px;line-height:1.65;color:#344054;">{{ section_1_body }}</p>
    </td></tr>

    <tr><td style="padding:24px 32px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
        <tr><td style="border-left:3px solid #2E5BFF;padding:4px 0 4px 16px;font-family:'Inter Tight',Inter,Helvetica,Arial,sans-serif;font-size:18px;line-height:1.5;color:#101828;">
          &ldquo;{{ quote }}&rdquo;
          <div style="margin-top:8px;font-family:Inter,Helvetica,Arial,sans-serif;font-size:13px;color:#667085;">— {{ quote_attribution }}</div>
        </td></tr>
      </table>
    </td></tr>

    <tr><td style="padding:0 32px 8px 32px;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
      <h2 style="margin:0 0 8px 0;font-size:19px;color:#101828;font-weight:700;">This week</h2>
      <ul style="margin:0;padding-left:20px;font-size:16px;line-height:1.65;color:#344054;">
        <li style="margin-bottom:6px;">{{ takeaway_1 }}</li>
        <li style="margin-bottom:6px;">{{ takeaway_2 }}</li>
        <li>{{ takeaway_3 }}</li>
      </ul>
    </td></tr>

    <tr><td style="padding:24px 32px 8px 32px;font-family:Inter,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.65;color:#344054;">
      <p style="margin:0;">{{ signoff }}</p>
    </td></tr>

    <tr><td style="padding:24px 32px 28px 32px;border-top:1px solid #EAECF0;font-family:Inter,Helvetica,Arial,sans-serif;font-size:12px;line-height:1.6;color:#667085;">
      <a href="{{ web_url }}" style="color:#2E5BFF;text-decoration:none;">Read on the web</a>
      &nbsp;·&nbsp;
      <a href="{{ unsubscribe_url }}" style="color:#667085;text-decoration:underline;">Unsubscribe</a>
    </td></tr>

  </table>
</td></tr>
</table>
</body>
</html>
