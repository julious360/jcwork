name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # requires-python in pyproject.toml is ">=3.11"; mypy's [tool.mypy]
        # python_version pins 3.11. Test both ends of the supported range
        # instead of only the newer one CI happened to be pinned to.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check agent tests

      - name: Format check
        run: ruff format --check agent tests

      - name: Type check
        run: mypy agent

      - name: Test
        run: pytest -v
